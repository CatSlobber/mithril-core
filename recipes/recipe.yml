---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: mithril-core
description: Fedora CoreOS with zfs
base-image: quay.io/fedora/fedora-coreos
image-version: stable

cosign-version: none
nushell-version: none

platforms:
  - linux/amd64

modules:
  - type: script
    scripts:
      - installzfskmod.sh
    secrets:
      - type: env
        name: KERNEL_PRIVKEY
        mount:
          type: file
          destination: /tmp/certs/private_key.priv
  - type: files
    files:
      - source: system/zfs
        destination: /

  - type: signing
